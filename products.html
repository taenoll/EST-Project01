<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prodcuts</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/products.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/component.css" />
  </head>
  <body>
    <header class="header">
      <div id="logo">AVENUE 9</div>
      <div class="menubar">
        <span>ABOUT</span>
        <span>COLLECTION</span>
        <span>PRODUCT</span>
      </div>
    </header>

    <section>
      <img
        src="./assets/images/home/home-hero-city.png"
        class="products_background_img"
        alt="도시의 건물들"
        width="100%"
      />
    </section>

    <section class="product_list">
      <div class="product_card">
        <h2>PERFUME</h2>
        <h3>SUNDAY 6PM</h3>
        <button type="button" class="volume_btn">50ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
      <div class="product_card">
        <h2>HAIRMIST</h2>
        <h3>NEWYORK FRIDAYS</h3>
        <button type="button" class="volume_btn">80ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
      <div class="product_card">
        <h2>HAND CARE</h2>
        <h3>MONDAY 9AM</h3>
        <button type="button" class="volume_btn">50ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
    </section>
  </body>
</html>
