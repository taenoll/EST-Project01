<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prodcuts</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/products.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/component.css" />
  </head>
  <body>
    <header class="header">
      <a href="./index.html" class="header__logo">AVENUE 9</a>

      <nav class="header__nav" aria-label="주요 메뉴">
        <ul class="header__nav-list">
          <li>
            <a href="#about">ABOUT</a>
          </li>
          <li>
            <a href="#collection">COLLECTIONS</a>
          </li>
          <li>
            <a href="#products">PRODUCTS</a>
          </li>
        </ul>
      </nav>
    </header>

    <section>
      <img
        src="./assets/images/home/home-hero-city.png"
        class="products_background_img"
        alt="도시의 건물들"
        width="100%"
      />
    </section>

    <section class="product_list">
      <div class="product_card">
        <h2>PERFUME</h2>
        <h3>SUNDAY 6PM</h3>
        <button type="button" class="volume_btn">50ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
      <div class="product_card">
        <h2>HAIRMIST</h2>
        <h3>NEWYORK FRIDAYS</h3>
        <button type="button" class="volume_btn">80ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
      <div class="product_card">
        <h2>HAND CARE</h2>
        <h3>MONDAY 9AM</h3>
        <button type="button" class="volume_btn">50ml</button>
        <button type="button" class="buynow_btn">BUY NOW</button>
      </div>
    </section>

    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__brand">
          <a href="./index.html" class="footer__logo">AVENUE 9</a>
          <p class="footer__tagline">Everyday scent, made for the city.</p>
        </div>

        <small class="footer__copyright">© 2026 AVENUE 9</small>
      </div>
    </footer>
  </body>
</html>
